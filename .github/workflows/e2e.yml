name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday: catches a breaking Syncthing release early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download Syncthing
        if: runner.os != 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "SYNCTHING_BIN=$(python tests/get_syncthing.py)" >> "$GITHUB_ENV"
      - name: Install Syncthing (macOS, the app the setup guide installs)
        if: runner.os == 'macOS'
        run: |
          brew install --cask syncthing-app
          bin=/Applications/Syncthing.app/Contents/Resources/syncthing/syncthing
          "$bin" --version
          echo "SYNCTHING_BIN=$bin" >> "$GITHUB_ENV"
      - name: End-to-end test (3 Syncthing instances, relay included)
        env:
          E2E_TMP: ${{ runner.temp }}
        run: python tests/e2e_test.py
